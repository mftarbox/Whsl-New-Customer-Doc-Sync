name: Shinesty Daily Sync Watchdog

# GitHub Actions scheduled workflows are not guaranteed to run — GitHub can
# delay them or, under load, silently skip a scheduled run with no error and
# no notification (documented GitHub behavior, not specific to this repo).
# This workflow checks in ~20 minutes after each of the main sync's 4
# expected daily run times and posts a Slack alert if the sync's most recent
# run is older than expected, i.e. that time slot appears to have been
# skipped or badly delayed.
on:
  schedule:
    - cron: "20 8 * * *"
      timezone: "America/Chicago"
    - cron: "20 11 * * *"
      timezone: "America/Chicago"
    - cron: "20 14 * * *"
      timezone: "America/Chicago"
    - cron: "20 17 * * *"
      timezone: "America/Chicago"
  workflow_dispatch: {}

permissions:
  actions: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check for a recent sync run, alert Slack if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: |
          set -e
          REPO="${{ github.repository }}"
          WORKFLOW_FILE="shinesty-daily-sync.yml"
          SLACK_CHANNEL_ID="C0ARSBBPGP7"   # #whsl_new_customer_alerts

          LATEST=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/actions/workflows/$WORKFLOW_FILE/runs?per_page=1")

          CREATED_AT=$(echo "$LATEST" | python3 -c "import sys, json; d=json.load(sys.stdin); runs=d.get('workflow_runs', []); print(runs[0]['created_at'] if runs else '')")
          STATUS=$(echo "$LATEST" | python3 -c "import sys, json; d=json.load(sys.stdin); runs=d.get('workflow_runs', []); print((runs[0].get('conclusion') or runs[0].get('status')) if runs else '')")

          if [ -z "$CREATED_AT" ]; then
            echo "No runs found at all for $WORKFLOW_FILE — treating as missed."
            MINUTES_AGO=999999
          else
            NOW_EPOCH=$(date -u +%s)
            RUN_EPOCH=$(date -u -d "$CREATED_AT" +%s)
            MINUTES_AGO=$(( (NOW_EPOCH - RUN_EPOCH) / 60 ))
          fi

          echo "Most recent Shinesty Daily Sync run: $CREATED_AT (status: $STATUS) — $MINUTES_AGO minute(s) ago"

          # This check runs 20 minutes after each expected run time, so a
          # healthy run should be well under an hour old. Past that, treat
          # the expected run as skipped or badly delayed.
          if [ "$MINUTES_AGO" -gt 60 ]; then
            curl -s -X POST https://slack.com/api/chat.postMessage \
              -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"channel\": \"$SLACK_CHANNEL_ID\", \"text\": \":warning: *Shinesty Daily Sync* — an expected scheduled run appears to have been skipped or delayed. Most recent run was $MINUTES_AGO minute(s) ago. This is a known GitHub Actions scheduling reliability issue (GitHub can silently drop scheduled runs under load), not a script error — check the repo's Actions tab, and re-run manually if needed.\"}"
            echo "Alert sent."
          else
            echo "OK — recent run found, no alert needed."
          fi
