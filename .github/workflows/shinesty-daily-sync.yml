name: Shinesty Daily Sync

# Runs 4x/day: 8am, 11am, 2pm, 5pm US Central. Uses the `timezone` field
# (added to GitHub Actions in March 2026) so this is pinned to true local
# Central time and does NOT drift across DST changeovers, unlike a fixed
# UTC cron offset.
#
# Note: GitHub Actions scheduled workflows are not guaranteed to fire at
# the exact scheduled time — GitHub can delay or, under high load, silently
# skip a scheduled run entirely (documented GitHub Actions behavior, not a
# bug in this workflow). See shinesty-daily-sync-watchdog.yml, which checks
# shortly after each of these times and alerts in Slack if a run appears to
# have been skipped.
on:
  schedule:
    - cron: "0 8 * * *"
      timezone: "America/Chicago"
    - cron: "0 11 * * *"
      timezone: "America/Chicago"
    - cron: "0 14 * * *"
      timezone: "America/Chicago"
    - cron: "0 17 * * *"
      timezone: "America/Chicago"
  workflow_dispatch: {}     # lets you trigger a run manually from the Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run sync
        env:
          MONDAY_API_KEY: ${{ secrets.MONDAY_API_KEY }}
          NS_ACCOUNT_ID: ${{ secrets.NS_ACCOUNT_ID }}
          NS_CONSUMER_KEY: ${{ secrets.NS_CONSUMER_KEY }}
          NS_CONSUMER_SECRET: ${{ secrets.NS_CONSUMER_SECRET }}
          NS_TOKEN_ID: ${{ secrets.NS_TOKEN_ID }}
          NS_TOKEN_SECRET: ${{ secrets.NS_TOKEN_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          NS_RESTLET_URL: ${{ secrets.NS_RESTLET_URL }}
        run: python shinesty_daily_sync.py
